<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Schedule</title>
<meta name="theme-color" content="#0b0713">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Your Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Oswald:wght@200;300&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--serif:'Newsreader','Source Serif 4',Georgia,'Times New Roman',serif;--sans:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;--clock:'Oswald','Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
--background:#070918;--background-secondary:#1a1a54;--text-primary:#f2f0fb;--text-secondary:#8a93d6;--accent:#8b5cf6;--accent-soft:#8f9be8;--ar:125,135,225;--glow:#7c5cf0;--clock-a:#a6b2f0;--clock-b:#6a76cf;
--separator:rgba(var(--ar),.2);--surface:rgba(var(--ar),.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html[data-c=rojo]{--background:#0f0507;--background-secondary:#3a0f17;--text-secondary:#c58b92;--accent:#e5484d;--accent-soft:#e8868c;--ar:235,120,125;--glow:#dc2626;--clock-a:#f29aa0;--clock-b:#d8454f}
html[data-c=azul]{--background:#050a1a;--background-secondary:#0e2a5c;--text-secondary:#86a8d8;--accent:#3b82f6;--accent-soft:#7fb5f5;--ar:100,160,240;--glow:#2563eb;--clock-a:#9fd0ff;--clock-b:#4b8de6}
html[data-c=verde]{--background:#04100a;--background-secondary:#0b3a22;--text-secondary:#83c4a5;--accent:#22c58b;--accent-soft:#5fd9a6;--ar:90,210,160;--glow:#16a34a;--clock-a:#8cf0c4;--clock-b:#2fb57f}
html[data-c=rosado]{--background:#11060e;--background-secondary:#3d0f2c;--text-secondary:#cf8db3;--accent:#ec4899;--accent-soft:#f08cc0;--ar:240,120,185;--glow:#db2777;--clock-a:#f7a0d0;--clock-b:#e0509a}
html[data-m=light]{--background:#f8f7ff;--text-primary:#1a1633;--text-secondary:#5f5a80;color-scheme:light}
html[data-m=light][data-c=morado]{--background-secondary:#e3e0fb;--accent:#6d28d9;--accent-soft:#5b5fc7;--ar:91,95,199;--clock-a:#6670d6;--clock-b:#4a52b8}
html[data-m=light][data-c=rojo]{--background-secondary:#fde3e4;--accent:#c81e2d;--accent-soft:#b4343d;--text-secondary:#7a5a5e;--ar:180,52,61;--clock-a:#d9505a;--clock-b:#b02a36}
html[data-m=light][data-c=azul]{--background-secondary:#dde9fd;--accent:#1d4ed8;--accent-soft:#2f66c4;--text-secondary:#55698c;--ar:47,102,196;--clock-a:#4d8be8;--clock-b:#1f56b8}
html[data-m=light][data-c=verde]{--background-secondary:#d9f3e5;--accent:#0f8a5f;--accent-soft:#1c7d57;--text-secondary:#4f7a66;--ar:28,125,87;--clock-a:#3dbb8a;--clock-b:#12805a}
html[data-m=light][data-c=rosado]{--background-secondary:#fde1f0;--accent:#c0267a;--accent-soft:#b02c78;--text-secondary:#8a5a75;--ar:176,44,120;--clock-a:#e0589f;--clock-b:#b02c78}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{min-height:100vh;min-height:100dvh;background:var(--background);color:var(--text-primary);font:400 15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 30% -8%,var(--background-secondary),transparent 70%),radial-gradient(70% 38% at 108% 36%,rgba(var(--ar),.13),transparent 70%),radial-gradient(80% 30% at 78% 98%,rgba(var(--ar),.11),transparent 70%)}
main{max-width:520px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin:0 auto;padding:26px 22px 28px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{color:var(--accent-soft);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
.hello{font:500 clamp(25px,7.4vw,31px)/1.15 var(--serif);margin-top:6px}
.gear{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--separator);background:var(--surface);color:var(--accent-soft);display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.clock{display:flex;align-items:center;justify-content:center;margin:clamp(8px,3vh,28px) 0 clamp(10px,3vh,26px);font-family:var(--clock);font-weight:200;font-size:min(27vw,138px);line-height:1;filter:drop-shadow(0 0 22px rgba(var(--ar),.22))}
.grp{display:flex}
.dg{display:inline-block;width:.54em;text-align:center;font-variant-numeric:tabular-nums;color:var(--clock-a);background:linear-gradient(180deg,var(--clock-a),var(--clock-b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.col{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.2em;width:.3em}
.col i{width:.065em;height:.065em;border-radius:50%;background:var(--clock-b)}
.ap{align-self:flex-end;margin:0 0 .2em .15em;font:300 .16em var(--clock);letter-spacing:.06em;color:var(--text-secondary)}
.hero{margin-top:4px}
.tag{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.2em;color:var(--accent-soft);text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(var(--ar),.7)}
.name{font:500 clamp(32px,9.6vw,42px)/1.1 var(--serif);margin-top:10px;overflow-wrap:break-word}
.prof{color:var(--text-secondary);margin-top:6px}
.range{margin-top:12px;font-variant-numeric:tabular-nums}
.bar{height:2px;border-radius:2px;background:var(--separator);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 8px rgba(var(--ar),.6);transition:width 1s linear}
.left{margin-top:8px;font-size:13px;color:var(--accent-soft)}
.next{display:flex;gap:16px;align-items:flex-start;margin-top:16px;padding-top:16px;border-top:1px solid var(--separator);line-height:1.6;color:var(--accent-soft)}
.next b{color:var(--text-primary);font-weight:400}
.ico{flex:none;width:30px;height:30px;margin-top:2px;fill:none;stroke:var(--accent-soft);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.days{position:relative;display:flex;margin-top:28px;border-bottom:1px solid var(--separator)}
.days button{position:relative;flex:1;min-height:48px;padding:6px 0 0;border:0;background:none;color:var(--text-secondary);font:inherit;font-size:16px;cursor:pointer}
.dbs{display:flex;width:100%}
.days button{transition:transform .4s cubic-bezier(.34,1.56,.64,1),color .25s}
.days button.on{color:var(--text-primary);transform:scale(1.22)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;transition:transform .5s cubic-bezier(.34,1.3,.5,1),width .3s}
.ind::after{content:"";display:block;margin:0 18%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(var(--ar),.65)}
.days button.hoy::before{content:"";position:absolute;top:7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent-soft);opacity:.8}
.days button:focus-visible,.sx:focus-visible,.gear:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sum{margin:20px 0 6px;font-size:12.5px;letter-spacing:.12em;color:var(--accent-soft)}
.item{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;padding:16px 0;border-bottom:1px solid var(--separator)}
.item:first-child{border-top:1px solid var(--separator)}
.t{padding-right:14px;line-height:1.55;font-variant-numeric:tabular-nums;white-space:nowrap}
.t span{color:var(--text-secondary)}
.ic{min-width:0;padding:2px 0 2px 16px;margin-right:12px;border-left:1px solid var(--separator)}
.ic h3{font:500 clamp(17px,5vw,20px)/1.22 var(--serif);overflow-wrap:break-word;hyphens:auto}
.ic p{margin-top:5px;font-size:14px;color:var(--text-secondary);overflow-wrap:break-word}
.stt{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.stt i{width:6px;height:6px;border-radius:50%;background:currentColor}
.item.live{background:linear-gradient(90deg,rgba(var(--ar),.07),transparent 80%)}
.item.live .stt{color:var(--accent-soft)}
.item.live .stt i{background:var(--accent);box-shadow:0 0 8px rgba(var(--ar),.8)}
.item.done{opacity:.55}
.item.off h3{text-decoration:line-through;text-decoration-thickness:1px;opacity:.6}
.sx{white-space:nowrap;min-height:38px;padding:0 16px;border:1px solid var(--separator);background:var(--surface);color:var(--text-secondary);font:inherit;font-size:13px;border-radius:999px;cursor:pointer}
.item.off .sx{color:var(--accent-soft);border-color:rgba(var(--ar),.45)}
.empty{padding:28px 0;text-align:center;color:var(--text-secondary);border-top:1px solid var(--separator);border-bottom:1px solid var(--separator)}
.aula{margin-top:auto;padding-top:36px;text-align:center;text-indent:.38em;font-size:13px;letter-spacing:.38em;color:var(--accent-soft);opacity:.75}
@media (max-width:380px){.item{grid-template-columns:72px minmax(0,1fr)}.ic{margin-right:0}.sx{grid-column:2;justify-self:start;margin:10px 0 0 16px}}
.panel{display:none;margin-top:16px;padding:16px 0;border-top:1px solid var(--separator);border-bottom:1px solid var(--separator)}
.panel.open{display:block}
.panel h4{font-size:12px;letter-spacing:.18em;color:var(--accent-soft);text-transform:uppercase;font-weight:400;margin:16px 0 8px}
.panel h4:first-child{margin-top:0}
.panel .sw{margin:0;justify-content:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel select{background:var(--background);color:var(--text-primary);border:1px solid var(--separator);border-radius:10px;padding:8px;font:inherit;font-size:14px}
.note{font-size:12.5px;color:var(--text-secondary);margin-top:10px}
.mini{padding:10px 14px;min-height:40px;border-radius:999px;border:1px solid var(--separator);background:var(--surface);color:var(--text-primary);font:inherit;font-size:13px;cursor:pointer;margin:12px 8px 0 0}
.sw{display:flex;gap:14px;justify-content:center;margin:14px 0}
.sw b{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw b.on{border-color:var(--text-primary)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);transition:transform .4s;z-index:30;width:min(420px,calc(100% - 28px));padding:16px 18px;border-radius:16px;background:var(--background-secondary);border:1px solid var(--accent);font-size:14px}
.toast.show{transform:translate(-50%,0)}
.toast b{display:block;font-weight:500;margin-bottom:3px}
.gate{position:fixed;inset:0;z-index:20;display:flex;padding:24px;overflow:auto}
.gbox{width:min(380px,100%);margin:auto}
.jp{font-family:var(--serif);font-size:15px;letter-spacing:.5em;color:var(--accent-soft);margin-bottom:8px}
.gname{font:500 34px/1.1 var(--serif);margin:12px 0 18px}
.gate input[type=text],.gate input:not([type]),.gate input[type=password],.gate input[type=time],.gate input[type=date]{width:100%;padding:14px 16px;margin-top:10px;border-radius:14px;border:1px solid var(--separator);background:var(--surface);color:var(--text-primary);font:inherit;font-size:16px;outline:none}
.gate input:focus{border-color:var(--accent)}
.btn{width:100%;margin-top:8px;padding:14px;border-radius:14px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:500;font-size:15px;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--accent);color:var(--accent-soft)}
.lnk{display:block;margin-top:16px;text-align:center;font-size:13px;color:var(--text-secondary);cursor:pointer;text-decoration:underline}
.err{color:#f4a3a8;font-size:13px;min-height:16px;text-align:center;margin-top:8px}
html[data-m=light] .err{color:#b4232f}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--text-secondary)}
.gate .note{margin:10px 0}
.cls{margin-top:14px}
.cl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--separator);font-size:14px}
.cl b{display:block;font-weight:500;font-size:15px}
.cl span{display:block;color:var(--text-secondary);margin-top:2px}
.cl a{cursor:pointer;color:var(--accent-soft);padding:6px 10px}
.dchips{display:flex;gap:6px;margin-top:12px}
.dchips button{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--separator);background:transparent;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer}
.dchips button.on{background:var(--surface);color:var(--text-primary);border-color:var(--accent)}
.trow{display:flex;gap:10px;margin-bottom:6px}
.tl{flex:1;font-size:12px;letter-spacing:.14em;color:var(--text-secondary);text-transform:uppercase;margin-top:12px}
.gate input[type=time]{margin-top:6px}
.meta{margin-top:6px;font-size:13px;color:var(--text-secondary)}
.meta:empty{display:none}
.jb{height:2px;margin-top:10px;border-radius:2px;background:var(--separator);overflow:hidden}
.jb i{display:block;height:100%;background:var(--accent-soft);opacity:.7;transition:width 1s linear}
.panel input[type=text]{width:100%;padding:12px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--separator);background:var(--surface);color:var(--text-primary);font:inherit;font-size:16px;outline:none}
.panel input[type=text]:focus{border-color:var(--accent)}
.sw1 .item{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.sw1 .item:nth-child(2){animation-delay:.05s}.sw1 .item:nth-child(3){animation-delay:.1s}.sw1 .item:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translate(var(--dx,0),8px)}}
.st{position:absolute;border-radius:50%;filter:blur(16px);background:linear-gradient(90deg,transparent,rgba(var(--ar),.55) 50%,transparent);transform:rotate(-38deg);animation:beam 22s ease-in-out infinite alternate}
.st.a{width:70vmax;height:3.2vmax;right:-34vmax;top:34vh}
.st.b{width:55vmax;height:2.6vmax;right:-26vmax;bottom:12vh;animation-duration:28s;animation-delay:-9s}
.st.c{width:60vmax;height:2.4vmax;left:-40vmax;top:10vh;animation-duration:34s;animation-delay:-16s;opacity:.6}
@keyframes beam{0%{opacity:.35;margin:0 0 0 0}50%{opacity:.9}100%{opacity:.5;margin:-4vmax 0 0 -6vmax}}
html[data-bg=off] .st{display:none}
html[data-paused] .st{animation-play-state:paused}
@property --accent{syntax:'<color>';inherits:true;initial-value:#8b5cf6}
@property --accent-soft{syntax:'<color>';inherits:true;initial-value:#8f9be8}
@property --background{syntax:'<color>';inherits:true;initial-value:#070918}
@property --background-secondary{syntax:'<color>';inherits:true;initial-value:#1a1a54}
@property --text-secondary{syntax:'<color>';inherits:true;initial-value:#8a93d6}
@property --clock-a{syntax:'<color>';inherits:true;initial-value:#a6b2f0}
@property --clock-b{syntax:'<color>';inherits:true;initial-value:#6a76cf}
@property --ar{syntax:'<number>#';inherits:true;initial-value:125,135,225}
html{transition:--accent .6s,--accent-soft .6s,--background .6s,--background-secondary .6s,--text-secondary .6s,--clock-a .6s,--clock-b .6s,--ar .6s}
html[data-amoled="1"]{--background:#000;--background-secondary:#05060d}
html[data-amoled="1"] .sky{background:radial-gradient(70% 38% at 108% 36%,rgba(var(--ar),.1),transparent 70%),radial-gradient(80% 30% at 78% 98%,rgba(var(--ar),.08),transparent 70%)}
.ic{border-left:2px solid var(--accent-soft);border-left-color:hsl(from var(--accent) calc(h + var(--hs,0)) s l)}
.rec{padding:9px 0 9px 98px;font-size:12px;letter-spacing:.06em;color:var(--text-secondary);border-bottom:1px solid var(--separator)}
.boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--background);transition:opacity .55s}
.boot.off{opacity:0;pointer-events:none}
.boot .mark{width:92px;height:auto;filter:drop-shadow(0 0 18px rgba(var(--ar),.35))}
.bt{font-size:13px;letter-spacing:.38em;text-indent:.38em;color:var(--accent-soft)}
.lg{margin-bottom:14px}.lg .mark{width:44px;height:auto}
.sx,.mini,.btn,.gear,.dchips button{transition:transform .15s,background-color .2s}
.sx:active,.mini:active,.btn:active,.gear:active,.dchips button:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic p.nt{font-size:12.5px;color:var(--accent-soft);cursor:pointer;margin-top:6px}.item.clash .stt{color:#f4a3a8}.left.warn{animation:pls 2s ease-in-out infinite}@keyframes pls{50%{opacity:.45}}</style>
</head>
<body>
<div class="boot" id="boot"><div class="bt">Inno-Vsion</div></div>
<div class="sky"><i class="st a"></i><i class="st b"></i><i class="st c"></i></div>
<div class="gate" id="gate" hidden></div>
<div class="toast" id="toast"></div>
<main id="app" hidden>
  <header class="top">
    <div><div class="date" id="date"></div><div class="hello" id="hello"></div><div class="meta" id="meta"></div></div>
    <button class="gear" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <section class="panel" id="panel"></section>
  <div class="clock" role="timer" aria-label="Hora actual"><div class="grp" id="gh"></div><div class="col"><i></i><i></i></div><div class="grp" id="gm"></div><div class="ap" id="ap"></div></div>
  <section class="hero" id="hero"></section>
  <nav class="days" id="days" aria-label="Días de la semana"><div class="dbs" id="dbs"></div><i class="ind" id="ind"></i></nav>
  <div class="sum" id="sum"></div>
  <div class="jb" id="jb" hidden><i id="jbi"></i></div>
  <div id="list"></div>
  <footer class="aula" id="aula">Inno-Vsion</footer>
</main>
<script>
var m=function(h,i){return h*60+(i||0)};
var A=[13*60,13*60+45,14*60+30,15*60+15,16*60,17*60+30];

{n:"Procesos Administrativos",p:"José Manuel Medina Gómez",d:{3:[m(16),m(17,30)],5:[m(13,45),m(15,15)]}}
